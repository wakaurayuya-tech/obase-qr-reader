<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>出退校QRリーダー</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px 15px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fa;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    #startButton {
      margin: 20px;
      padding: 18px 35px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #1976d2;
      color: white;
    }

    #cameraBox {
      display: none;
      position: relative;
      width: 95%;
      max-width: 600px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }

    #camera {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    #guide {
      position: absolute;
      width: 65%;
      aspect-ratio: 1 / 1;
      left: 17.5%;
      top: 50%;
      transform: translateY(-50%);
      border: 5px solid white;
      border-radius: 15px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #status {
      margin: 20px auto 0;
      max-width: 700px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    #result {
      display: none;
      margin: 15px auto;
      padding: 15px;
      max-width: 700px;
      background: white;
      border-radius: 12px;
      word-break: break-all;
      font-size: 14px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>出退校受付</h1>

  <p>
    学生証のQRコードを<br>
    白い枠の中にかざしてください
  </p>

  <button id="startButton">
    QR読み取りを開始
  </button>

  <div id="cameraBox">
    <video id="camera"
           autoplay
           playsinline
           muted></video>
    <div id="guide"></div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="status">
    「QR読み取りを開始」を押してください
  </div>

  <div id="result"></div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const button = document.getElementById("startButton");
const cameraBox = document.getElementById("cameraBox");
const status = document.getElementById("status");
const result = document.getElementById("result");

let scanning = false;
let lastScan = 0;


/* -------------------------
   カメラ起動
------------------------- */

button.addEventListener("click", async () => {

  try {

    status.textContent =
      "インカメラを起動しています…";

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",

          /* iPadで処理しやすいサイズ */
          width: { ideal: 640 },
          height: { ideal: 480 }
        },

        audio: false

      });

    video.srcObject = stream;

    cameraBox.style.display = "block";
    button.style.display = "none";

    await video.play();

    scanning = true;

    status.textContent =
      "QRコードを白い枠の中にかざしてください";

    requestAnimationFrame(scanQR);

  }

  catch(error) {

    status.textContent =
      "カメラエラー：" +
      error.name +
      " / " +
      error.message;

  }

});


/* -------------------------
   QR読み取り
------------------------- */

function scanQR(time) {

  if (!scanning) return;


  /*
   毎フレーム解析せず
   約200msごとに解析
  */

  if (time - lastScan < 200) {

    requestAnimationFrame(scanQR);
    return;

  }

  lastScan = time;


  if (video.readyState ===
      video.HAVE_ENOUGH_DATA) {


    /*
     解析サイズを固定して
     iPadの負荷を軽くする
    */

    const scanWidth = 480;

    const ratio =
      video.videoHeight /
      video.videoWidth;

    const scanHeight =
      Math.round(scanWidth * ratio);


    canvas.width = scanWidth;
    canvas.height = scanHeight;


    ctx.drawImage(
      video,
      0,
      0,
      scanWidth,
      scanHeight
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        scanWidth,
        scanHeight
      );


    /*
     通常＋反転QRの両方を確認
    */

    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code && code.data) {

      scanning = false;

      status.textContent =
        "✅ QRコードを読み取りました！";

      result.style.display =
        "block";

      result.textContent =
        code.data;

      /*
       読み取り成功時に
       カメラ停止
      */

      const stream =
        video.srcObject;

      if (stream) {

        stream
          .getTracks()
          .forEach(track =>
            track.stop()
          );

      }

      return;

    }

  }


  requestAnimationFrame(scanQR);

}

</script>

</body>
</html>
