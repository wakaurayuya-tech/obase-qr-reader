<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>出退校QRリーダー</title>

  <!-- QRコード読み取りライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      padding: 25px 15px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fa;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    #startButton {
      margin: 20px;
      padding: 18px 35px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #1976d2;
      color: white;
    }

    #cameraBox {
      display: none;
      position: relative;
      width: 90%;
      max-width: 650px;
      margin: 20px auto;
    }

    #camera {
      width: 100%;
      border-radius: 20px;
      background: black;
      transform: scaleX(-1);
    }

    #guide {
      position: absolute;
      width: 55%;
      aspect-ratio: 1 / 1;
      left: 22.5%;
      top: 50%;
      transform: translateY(-50%);
      border: 4px solid white;
      border-radius: 15px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    #result {
      margin: 20px auto;
      padding: 15px;
      max-width: 700px;
      font-size: 15px;
      word-break: break-all;
      background: white;
      border-radius: 12px;
      display: none;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>出退校受付</h1>

  <p>
    学生証のQRコードを<br>
    枠の中にかざしてください
  </p>

  <button id="startButton">
    QR読み取りを開始
  </button>

  <div id="cameraBox">
    <video id="camera"
           autoplay
           playsinline
           muted></video>

    <div id="guide"></div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="status">
    「QR読み取りを開始」を押してください
  </div>

  <div id="result"></div>


  <script>

    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("canvas");

    const context =
      canvas.getContext("2d", {
        willReadFrequently: true
      });

    const button =
      document.getElementById("startButton");

    const cameraBox =
      document.getElementById("cameraBox");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");

    let scanning = false;


    button.addEventListener("click", async () => {

      try {

        status.textContent =
          "インカメラを起動しています…";

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user",
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },

            audio: false

          });


        video.srcObject = stream;

        cameraBox.style.display = "block";

        button.style.display = "none";

        await video.play();

        scanning = true;

        status.textContent =
          "学生証のQRコードを枠の中にかざしてください";

        requestAnimationFrame(scanQR);


      } catch (error) {

        status.textContent =
          "カメラエラー：" +
          error.name +
          " / " +
          error.message;

      }

    });


    function scanQR() {

      if (!scanning) {
        return;
      }


      if (video.readyState === video.HAVE_ENOUGH_DATA) {

        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imageData =
          context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const code =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "dontInvert"
            }
          );


        if (code && code.data) {

          scanning = false;

          status.textContent =
            "QRコードを読み取りました！";

          result.style.display =
            "block";

          result.textContent =
            code.data;

          return;
        }
      }


      requestAnimationFrame(scanQR);
    }

  </script>

</body>
</html>
