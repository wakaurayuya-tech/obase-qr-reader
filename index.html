<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        user-scalable=no">

  <title>出退校QRリーダー</title>

  <!-- QRコード読み取りライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    body {
      margin: 0;
      padding: 20px 15px;
      text-align: center;
      font-family: -apple-system,
                   BlinkMacSystemFont,
                   "Helvetica Neue",
                   sans-serif;
      background: #f5f7fa;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    #startButton {
      margin: 20px;
      padding: 18px 35px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #1976d2;
      color: white;
    }

    #cameraBox {
      display: none;
      position: relative;
      width: 95%;
      max-width: 600px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
    }

    #camera {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    #guide {
      position: absolute;

      width: 65%;
      aspect-ratio: 1 / 1;

      left: 17.5%;
      top: 50%;

      transform: translateY(-50%);

      border: 5px solid white;
      border-radius: 15px;

      box-sizing: border-box;
      pointer-events: none;
    }

    #status {
      margin: 20px auto 0;
      max-width: 700px;

      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    #result {
      display: none;

      margin: 15px auto;
      padding: 15px;

      max-width: 700px;

      background: white;
      border-radius: 12px;

      word-break: break-all;
      font-size: 14px;
    }

    canvas {
      display: none;
    }

  </style>
</head>


<body>

  <h1>出退校受付</h1>

  <p>
    学生証のQRコードを<br>
    白い枠の中にかざしてください
  </p>


  <button id="startButton">
    QR読み取りを開始
  </button>


  <div id="cameraBox">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <div id="guide"></div>

  </div>


  <canvas id="canvas"></canvas>


  <div id="status">
    「QR読み取りを開始」を押してください
  </div>


  <div id="result"></div>


<script>

  /* =====================================
     各要素
  ===================================== */

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  const button =
    document.getElementById("startButton");

  const cameraBox =
    document.getElementById("cameraBox");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");


  let scanning = false;

  let lastScan = 0;



  /* =====================================
     カメラ起動
  ===================================== */

  button.addEventListener(
    "click",
    async () => {

      try {

        status.textContent =
          "インカメラを起動しています…";


        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: "user",

              width: {
                ideal: 640
              },

              height: {
                ideal: 480
              }

            },

            audio: false

          });


        video.srcObject = stream;


        cameraBox.style.display =
          "block";


        button.style.display =
          "none";


        await video.play();


        scanning = true;


        status.textContent =
          "QRコードを白い枠の中にかざしてください";


        requestAnimationFrame(scanQR);

      }

      catch(error) {

        status.textContent =
          "カメラエラー：" +
          error.name +
          " / " +
          error.message;

      }

    }
  );



  /* =====================================
     QRコード読み取り
  ===================================== */

  function scanQR(time) {

    if (!scanning) {
      return;
    }


    /*
      約80msごとに解析
    */

    if (time - lastScan < 80) {

      requestAnimationFrame(scanQR);

      return;

    }


    lastScan = time;



    if (
      video.readyState ===
      video.HAVE_ENOUGH_DATA
    ) {


      /*
        カメラ映像の中央部分だけを解析する
        白枠より少し広めの範囲
      */

      const videoWidth =
        video.videoWidth;

      const videoHeight =
        video.videoHeight;


      /*
        映像の短辺の約80％を
        正方形として切り出す
      */

      const cropSize =
        Math.round(
          Math.min(
            videoWidth,
            videoHeight
          ) * 0.80
        );


      const sourceX =
        Math.round(
          (videoWidth - cropSize) / 2
        );

      const sourceY =
        Math.round(
          (videoHeight - cropSize) / 2
        );


      /*
        解析用Canvasは360×360
        処理する画素数を減らして高速化
      */

      const scanSize = 360;


      canvas.width =
        scanSize;

      canvas.height =
        scanSize;



      /*
        中央部分だけCanvasへ取り込む
      */

      ctx.drawImage(
        video,

        sourceX,
        sourceY,
        cropSize,
        cropSize,

        0,
        0,
        scanSize,
        scanSize
      );



      const imageData =
        ctx.getImageData(
          0,
          0,
          scanSize,
          scanSize
        );



      /*
        QRコード解析

        通常の
        明るい背景＋黒QRのみ解析
      */

      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "dontInvert"
          }
        );



      /* =================================
         QRを読み取った場合
      ================================= */

      if (
        code &&
        code.data
      ) {


        scanning = false;


        const qrUrl =
          code.data.trim();


        status.textContent =
          "✅ QRコードを読み取りました";



        /*
          GoogleフォームのURLかチェック
        */

        let validForm = false;


        try {

          const url =
            new URL(qrUrl);


          if (
            url.hostname ===
              "docs.google.com" &&

            url.pathname.startsWith(
              "/forms/"
            )
          ) {

            validForm = true;

          }


          if (
            url.hostname ===
            "forms.gle"
          ) {

            validForm = true;

          }

        }

        catch(error) {

          validForm = false;

        }



        /* =================================
           学生証以外のQRの場合
        ================================= */

        if (!validForm) {


          status.textContent =
            "⚠️ 学生証のQRコードではありません";


          setTimeout(
            () => {

              scanning = true;

              status.textContent =
                "QRコードを白い枠の中にかざしてください";

              requestAnimationFrame(
                scanQR
              );

            },
            2000
          );


          return;

        }



        /* =================================
           正しい学生証QR
        ================================= */

        status.textContent =
          "フォームを開いています…";


        /*
          カメラ停止
        */

        const stream =
          video.srcObject;


        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }



        /*
          Googleフォームへ即時移動
        */

        window.location.assign(
          qrUrl
        );


        return;

      }

    }



    /*
      QR未検出なら
      次の解析へ
    */

    requestAnimationFrame(scanQR);

  }

</script>

</body>
</html>
